name: Bootstrap repository
on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/loyola_bootstrap.b64"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and expand project archive
        run: |
          test -f .bootstrap/loyola_bootstrap.b64
          base64 -d .bootstrap/loyola_bootstrap.b64 > /tmp/loyola_vercel_ready.zip
          rm -rf /tmp/loyola_unpack
          mkdir -p /tmp/loyola_unpack
          unzip -q /tmp/loyola_vercel_ready.zip -d /tmp/loyola_unpack
          shopt -s dotglob
          cp -R /tmp/loyola_unpack/loyola_vercel_ready/* .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit expanded repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Loyola application"
          git push
