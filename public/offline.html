<!DOCTYPE html>
<!-- Page de secours minimale lorsque le shell React n'est pas encore en cache. -->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Connexion perdue</title>
  <style>
    /* Présentation volontairement minimale : aucun autre message n'est affiché. */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding-top: 1rem;
      box-sizing: border-box;
      background: #fff9f2;
      font-family: Arial, Helvetica, sans-serif;
    }

    p {
      margin: 0;
      border-radius: 0.75rem;
      background: #d97706;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.9rem 1.25rem;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.18);
    }
  </style>
</head>
<body>
  <p role="status" aria-live="assertive">Connexion perdue</p>
</body>
</html>
